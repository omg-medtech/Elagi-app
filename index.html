<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04A093">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عِلاجي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Elagi — نساعدك لتتعافى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#04A093; --teal-d:#037A70; --teal-soft:#E2F5F3;
  --coral:#EE7666; --coral-d:#C4503F;
  --ink:#3D464B; --ink-2:#5E6A70; --line:#E1E8E9;
  --bg:#F6F9F9; --card:#FFFFFF; --mint:#E2F5F3; --warn:#FFF3E0; --warn-ink:#8A4B00;
  --shadow:0 8px 24px rgba(4,160,147,.20);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EEEF; --ink-2:#9FB0B4; --line:#2A3538; --bg:#0F1719; --card:#172124; --mint:#123330; --teal-soft:#123330;
    --warn:#3A2A10; --warn-ink:#FFD9A0; --teal-d:#3CC9BB; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#E8EEEF; --ink-2:#9FB0B4; --line:#2A3538; --bg:#0F1719; --card:#172124; --mint:#123330; --teal-soft:#123330;
  --warn:#3A2A10; --warn-ink:#FFD9A0; --teal-d:#3CC9BB; --shadow:0 8px 24px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:10px}
.shell{height:100%;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:460px;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.shell{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.08)}}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:left}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;width:100%;border-radius:18px;font-weight:600;font-size:17px;padding:0 20px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);color:#fff;box-shadow:var(--shadow)}
.btn.primary:disabled{opacity:.55;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--teal-d);border:2px solid var(--teal)}
.btn.coral{background:var(--coral);color:#fff}
.btn.quiet{background:transparent;color:var(--teal-d);min-height:44px;font-size:15px}
.btn.danger{background:transparent;color:var(--coral-d);border:2px solid var(--coral)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--ink)}
.icon-btn:active{background:var(--mint)}

/* Welcome */
.welcome{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 26px 20px;text-align:center;overflow:hidden}
.welcome::before{content:"";position:absolute;inset-block:-12% -12%;inset-inline-start:-38%;width:78%;border-radius:50%;background:var(--mint);z-index:0}
.welcome>*{position:relative;z-index:1}
.wordmark{font-size:58px;font-weight:700;line-height:1.1;margin:10px 0 12px;letter-spacing:-.5px}
.latin{font-size:44px;font-weight:700;line-height:1;margin:8px 0 18px;color:var(--ink)}
.slogan{font-size:26px;font-weight:600;margin:6px 0 4px;color:var(--teal-d)}
.sub{margin:0 0 26px;color:var(--ink-2);font-size:16px}
.ctas{display:grid;gap:12px;width:100%;max-width:340px}
.authbox{display:grid;gap:10px;width:100%;max-width:340px}.authbox .field{margin-bottom:0}
.welcome{justify-content:flex-start;overflow-y:auto;padding-top:18px;padding-bottom:24px}
.fine{margin:18px 0 0;font-size:12.5px;color:var(--ink-2)}
.logo .h1,.logo .h2{animation:join .5s cubic-bezier(.2,.8,.2,1) both}
.logo .h1{--dx:-22px;--dy:14px}.logo .h2{--dx:22px;--dy:-14px}
.logo .ck{animation:pop .35s .45s cubic-bezier(.2,1.4,.4,1) both;transform-origin:60px 60px}
@keyframes join{from{transform:translate(var(--dx),var(--dy));opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.logo-shift{display:inline-block}
.logo-shift.introshift{animation:capShift 1.5s cubic-bezier(.65,0,.28,1) both}
@keyframes capShift{0%{transform:translateY(23vh)}58%{transform:translateY(23vh)}100%{transform:translateY(0)}}
.logo-wrap{display:inline-block;transform-origin:50% 50%}
.logo-wrap.intro{animation:capZoom 1.5s cubic-bezier(.65,0,.28,1) both}
@keyframes capZoom{0%{transform:scale(4.4)}58%{transform:scale(4.4)}100%{transform:scale(1)}}
.wc-rest{display:flex;flex-direction:column;align-items:center;width:100%}
.wc-rest.reveal{opacity:0;animation:wcReveal .55s 1.25s cubic-bezier(.2,.8,.2,1) both}
@keyframes wcReveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo .h1,.logo .h2,.logo .ck,.logo-wrap.intro,.logo-shift.introshift{animation:none}.wc-rest.reveal{animation:none;opacity:1;transform:none}}


/* Top bars */
.bar{display:flex;align-items:center;gap:6px;padding:10px 10px 4px}
.bar h2{flex:1;margin:0;font-size:19px;font-weight:700;text-align:center}
.bar .sp{width:44px}
.prog{height:6px;background:var(--line);border-radius:6px;margin:6px 18px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.stepno{margin:14px 0 2px;color:var(--ink-2);font-size:14px}
h1.t{font-size:25px;line-height:1.3;margin:2px 0 6px;font-weight:700}
p.lead{margin:0 0 18px;color:var(--ink-2)}
.foot{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--bg);display:grid;gap:8px}

/* Fields */
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
.inp{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:17px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.err{color:var(--coral-d);font-size:14px;margin:6px 2px 0}
.hint{color:var(--ink-2);font-size:13.5px;margin:6px 2px 0}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:var(--r-md);padding:14px 16px;margin:0 0 16px;font-size:15px}
.notice .btn{margin-top:10px;min-height:46px;font-size:15px}

/* Cards */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);padding:16px}
.next{background:var(--teal);color:#fff;border-radius:var(--r-lg);padding:20px 18px;text-align:center;box-shadow:var(--shadow)}
.next .when{opacity:.95;font-size:17px}
.next .med{font-size:21px;font-weight:700;margin:6px 0 2px;line-height:1.35}
.next .meal{font-size:14.5px;opacity:.95}
.next .late{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 12px;font-size:13px;margin-bottom:4px}
.acts{display:flex;justify-content:space-evenly;margin:22px 0 18px}
.act{display:grid;justify-items:center;gap:8px;font-size:15px;font-weight:500;min-width:96px}
.act b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.act.ok b{background:var(--teal)}.act.no b{background:var(--coral)}
.tip{background:var(--mint);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px}
.tip h4{margin:0 0 4px;font-size:15.5px}
.tip p{margin:0;font-size:15px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sec h3{margin:0;font-size:17px}
.sec small{color:var(--ink-2)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.item .th{width:46px;height:46px;border-radius:14px;background:var(--mint);color:var(--teal-d);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;line-height:1.35;word-break:break-word}
.item .tx small{color:var(--ink-2);display:block;font-size:13.5px}
.item .tm{font-weight:600;color:var(--teal-d);white-space:nowrap}
.low{background:var(--warn);color:var(--warn-ink);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px;font-size:14.5px;display:flex;gap:10px}
.empty{text-align:center;padding:34px 12px;color:var(--ink-2)}
.empty .big{font-size:44px;color:var(--teal);margin-bottom:8px}

/* Bottom nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 6px 8px}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--ink-2);border-radius:12px;position:relative}
.nav button svg{font-size:23px}
.nav button[aria-current="page"]{color:var(--teal-d);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:38px;height:3px;border-radius:3px;background:var(--teal)}

/* Sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(15,25,28,.5);animation:fade .2s both}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:14px 18px 22px;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-h h3{margin:0;font-size:20px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.alert-name{background:var(--teal);color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:700;font-size:18px;margin:6px 0 14px;box-shadow:var(--shadow)}
.photo-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.photo-row .pv{width:76px;height:76px;border-radius:18px;background:var(--mint);color:var(--teal-d);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}
.photo-row .pv img{width:100%;height:100%;object-fit:cover}
.photo-row .bts{display:grid;gap:8px;flex:1}
.mini{min-height:44px;border-radius:14px;border:2px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card)}
.res{display:grid;gap:8px;margin:8px 0 14px}
.res button{text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.35}
.res button small{display:block;color:var(--ink-2);font-size:12.5px}
.res button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.sel{background:var(--mint);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14.5px}
.sel b{display:block;font-size:16px;margin-bottom:2px}
.sel div{color:var(--ink-2)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);font-size:22px;display:grid;place-items:center;background:var(--card)}
.step output{min-width:48px;text-align:center;font-weight:700;font-size:20px}
.pv-times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pv-times span{background:var(--mint);color:var(--teal-d);border-radius:10px;padding:3px 10px;font-weight:600;font-size:14px}
.otp{letter-spacing:.5em;text-align:center;font-size:28px;font-weight:700;direction:ltr}
.wa{background:#DCF8C6;color:#1c2b1c;border-radius:16px 16px 4px 16px;padding:12px 14px;margin:0 0 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:15px}
.wa small{display:block;color:#3f6b3f;margin-bottom:2px;font-weight:600}
.toast{position:absolute;inset-inline:16px;bottom:92px;z-index:40;background:#243034;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .25s both}
.toast span{flex:1;font-size:15px}
.toast button{color:#7FE3D8;font-weight:700;padding:6px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--ink-2)}.kv b{font-weight:600;text-align:end}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw small{display:block;color:var(--ink-2);font-size:13px}
.tg{width:52px;height:30px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.tg[aria-checked="true"]{background:var(--teal)}
.tg[aria-checked="true"]::after{inset-inline-start:25px}
.who{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.who .av{width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.tipc{display:flex;gap:12px;align-items:flex-start}
.tipc .bulb{color:var(--coral);font-size:24px;margin-top:2px}

.av{border-radius:50%;background:var(--teal);color:#fff;display:inline-grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;flex:none;border-radius:50%}
.av-cam{position:absolute;bottom:-2px;inset-inline-end:-2px;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;border:2px solid var(--bg)}
.hd-av{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.alarm{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#12BFAF 0%,#04A093 45%,#036B62 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:26px 24px 22px;overflow-y:auto}
.alarm[hidden]{display:none}
.al-clock{font-size:15px;opacity:.92}
.al-clock b{display:block;font-size:42px;font-weight:600;line-height:1.15}
.al-mid{display:grid;justify-items:center;gap:6px;padding:10px 0;max-width:100%}
.al-photo{width:164px;height:164px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;overflow:hidden;font-size:72px;box-shadow:0 0 0 10px rgba(255,255,255,.18),0 0 0 22px rgba(255,255,255,.09);animation:ring 1.8s ease-in-out infinite}
.al-photo img{width:100%;height:100%;object-fit:cover}
@keyframes ring{50%{box-shadow:0 0 0 16px rgba(255,255,255,.22),0 0 0 32px rgba(255,255,255,.06)}}
@media (prefers-reduced-motion:reduce){.al-photo{animation:none}}
.al-l1{margin:16px 0 0;font-size:22px;font-weight:500}
.al-name{margin:0;font-size:30px;font-weight:700;line-height:1.3;max-width:100%;word-break:break-word}
.al-meal{margin:6px 0 0;opacity:.95;font-size:16px}
.al-acts{width:100%;display:grid;gap:10px}
.al-acts .btn.w{background:#fff;color:var(--teal-d);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.al-acts .btn.o{background:rgba(255,255,255,.16);color:#fff}
.al-acts .btn.q{color:#fff;min-height:44px;font-size:15px;background:transparent}
.res button b{display:block;font-weight:600}

.welcome>.langbtn{position:absolute;top:12px;inset-inline-end:14px;z-index:3;min-height:40px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}
.or{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;margin:18px 0 0;color:var(--ink-2);font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:flex;gap:16px;justify-content:center;margin-top:14px}
.sbtn{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);transition:transform .12s}.sbtn:active{transform:scale(.95)}.sbtn:disabled{opacity:.5}
.latin{display:none}

/* ===== v6 finishing touches ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--shadow-1:0 1px 2px rgba(16,40,44,.05),0 4px 14px rgba(16,40,44,.05);--shadow-2:0 2px 4px rgba(16,40,44,.06),0 10px 28px rgba(16,40,44,.09)}
.ltr{max-width:100%;overflow-wrap:anywhere}
/* medicine rows: the name never squeezes the layout */
.item{align-items:flex-start;flex-wrap:wrap;gap:12px;padding:14px;box-shadow:var(--shadow-1);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.item .tx{flex:1 1 0;min-width:0}
.item .tx>b.ltr{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;width:100%;font-size:15.5px;line-height:1.4;font-weight:700;overflow-wrap:anywhere;text-align:start}
[dir="rtl"] .item .tx>b.ltr{text-align:right}
.item .tx small{display:block;color:var(--ink-2);font-size:13px;line-height:1.55;margin-top:2px}
.item .tx small.gen{overflow-wrap:anywhere;text-align:start}
[dir="rtl"] .item .tx small.gen{text-align:right}
.item .tx small.lowtag,.lowtag{color:var(--coral-d)!important;font-weight:700}
:root[data-theme="dark"] .lowtag{color:#FF9C8F!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lowtag{color:#FF9C8F!important}}
.ia{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.ia-r{display:inline-flex;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:var(--mint);color:var(--teal-d);font-weight:600;font-size:14px;transition:transform .12s var(--ease),background .2s}
.pill:active{transform:scale(.96)}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.btn.pulse{animation:pls 1.2s ease-in-out infinite}
.icon-btn.sm{width:40px;height:40px;border-radius:12px}
.icon-btn{transition:background .15s,transform .12s var(--ease)}
.icon-btn:active{background:var(--mint);transform:scale(.94)}
/* surfaces */

const Cloud={
  async currentUser(){
    if(!sb)throw sbInitError||new Error("no supabase");
    let r;try{r=await sb.auth.getUser()}catch(e){r={error:e}}
    if(r.error||!r.data?.user){
      if(netErr(r.error)){const {data:ss}=await sb.auth.getSession();if(ss?.session?.user)return ss.session.user}
      if(r.error)cloudError(r.error);throw new Error("يجب تسجيل الدخول أولًا");
    }
    return r.data.user;
  },
  async signUp(email,password,first,last){
    if(!sb)throw sbInitError||new Error("no supabase");
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name:first,last_name:last,full_name:`${first} ${last}`.trim()},emailRedirectTo:location.origin+location.pathname}});
    if(error)cloudError(error);return data;
  },
  async signIn(email,password){
    if(!sb)throw sbInitError||new Error("no supabase");
    const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)cloudError(error);return data;
  },
  async sendOtp(email,meta={}){
    if(!sb)throw sbInitError||new Error("no supabase");
    const options={shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname};if(meta&&Object.keys(meta).length)options.data=meta;
    const {error}=await sb.auth.signInWithOtp({email,options});if(error)cloudError(error);
  },
  async verifyEmailOtp(email,token){
    if(!sb)throw sbInitError||new Error("no supabase");
    const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});if(error)cloudError(error);return data.user;
  },
  async verifySignup(email,token){
    if(!sb)throw sbInitError||new Error("no supabase");
    const {data,error}=await sb.auth.verifyOtp({email,token,type:"signup"});if(error)cloudError(error);return data.user;
  },
  async resendSignup(email){
    if(!sb)throw sbInitError||new Error("no supabase");
    const {error}=await sb.auth.resend({type:"signup",email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)cloudError(error);
  },
  async get(){
    const user=await this.currentUser(),dk="elagi.pwa.data."+user.id,dirty=lsGet(dk+".dirty"),cached=lsGet(dk);
    if(dirty&&cached){ // unsynced offline edits win; push them now
      const prof={...cached,email:user.email,_authUserId:user.id};
      this.put(prof).catch(()=>{});return prof;
    }
    let r;try{r=await sb.from("user_data").select("data").eq("user_id",user.id).maybeSingle()}catch(e){r={error:e}}
    if(r.error){if(netErr(r.error)&&cached)return {...cached,email:user.email,_authUserId:user.id};cloudError(r.error)}
    if(!r.data?.data)return null;
    const profile={...r.data.data,email:user.email,_authUserId:user.id};cacheLocalProfile(user.id,profile);lsSet(dk,profile);return profile;
  },
  async put(u){
    const user=await this.currentUser(),dk="elagi.pwa.data."+user.id;
    const payload={...u,email:user.email};delete payload._authUserId;
    lsSet(dk,payload);
    let r;try{r=await sb.from("user_data").upsert({user_id:user.id,data:payload},{onConflict:"user_id"})}catch(e){r={error:e}}
    if(r.error){if(netErr(r.error)){lsSet(dk+".dirty",1);return user.id}cloudError(r.error)}
    lsDel(dk+".dirty");cacheLocalProfile(user.id,payload);return user.id;
  },
  async del(){
    const user=await this.currentUser();
    const {error}=await sb.from("user_data").delete().eq("user_id",user.id);if(error)cloudError(error);
    clearLocalProfile(user.id);return user.id;
  }
};

const ALIAS={"بانادول":"PANADOL","بنادول":"PANADOL","جلوكوفاج":"GLUCOPHAGE","جلوكوفج":"GLUCOPHAGE","لازيكس":"LASIX","كونجستال":"CONGESTAL","اموكسيل":"AMOXIL","اوجمنتين":"AUGMENTIN","أوجمنتين":"AUGMENTIN","كتافلام":"CATAFLAM","فولتارين":"VOLTAREN","نيكسيوم":"NEXIUM","كونتلوك":"CONTROLOC","ليبيتور":"LIPITOR","كريستور":"CRESTOR","ديابيكس":"DIABEX","اميريل":"AMARYL","أميريل":"AMARYL","تريتاس":"TRITACE","كابوتين":"CAPOTEN","نورفاسك":"NORVASC","تنورمين":"TENORMIN","اسبوسيد":"ASPOCID","أسبوسيد":"ASPOCID","ثيروكسين":"THYROXINE","يوروكسين":"EUTHYROX","يوثيروكس":"EUTHYROX","فنتولين":"VENTOLIN","بروفين":"BRUFEN","ميتفورمين":"METFORMIN","انسولين":"INSULIN","إنسولين":"INSULIN","لانتوس":"LANTUS","نوفورابيد":"NOVORAPID","ليفيميير":"LEVEMIR","اسبرين":"ASPIRIN","أسبرين":"ASPIRIN","كليكساين":"CLEXANE","جانوفيا":"JANUVIA","جالفوس":"GALVUS","اوميبرازول":"OMEPRAZOLE","كونكور":"CONCOR","ديوفان":"DIOVAN","اكسفورج":"EXFORGE","كوزار":"COZAAR"};
function normQ(q){
  q=(q||"").trim();
  if(/[\u0600-\u06FF]/.test(q)){
    const w=q.split(/\s+/).map(x=>ALIAS[x]||x).filter(x=>!/[\u0600-\u06FF]/.test(x));
    q=w.join(" ");
  }
  return q.toUpperCase().replace(/[^A-Z0-9 .+\-]/g," ").replace(/\s+/g," ").trim();
}
function searchDrugs(q,limit=8){
  q=normQ(q); if(q.length<2)return[];
  const T=q.split(" ").filter(Boolean), res=[];
  for(let i=0;i<NU.length;i++){
    const n=NU[i]; let s=0,ok=true;
    for(const t of T){
      const p=n.indexOf(t);
      if(p<0){ if(GU[i].includes(t)) s+=1; else{ok=false;break} }
      else s+= p===0?6:(n[p-1]===" "?3:1);
    }
    if(ok)res.push([s,i]);
  }
  res.sort((a,b)=>b[0]-a[0]||NU[a[1]].length-NU[b[1]].length);
  return res.slice(0,limit).map(x=>x[1]);
}

function formOf(route,name){
  const n=(name||"").toUpperCase();
  if(/SYRUP|SUSP|DROPS|ELIXIR|\bSYR\b|LOTION|CREAM|\bGEL\b(?!\s*CAPS?)|OINT/.test(n))return{kind:"liquid",unit:""};
  if(route==="ORAL.SOLID")return{kind:"solid",unit:"قرص/كبسولة"};

  if(route&&route!=="UNKNOWN")return{kind:"liquid",unit:""};
  return{kind:"solid",unit:"قرص/كبسولة",ask:true};
}

async function prepPhoto(file){
  const bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
  const draw=(max,q,type)=>new Promise(res=>{const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);c.toBlob(b=>res(b),type||"image/jpeg",q)});
  const thumbBlob=await draw(420,.72), big=await draw(1024,.8);
  const thumb=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(thumbBlob)});
  return{thumb,big};
}
async function prepAvatar(file){
  const im=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u});
  const c=document.createElement("canvas");c.width=c.height=256;const s=Math.min(im.width,im.height);
  c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
  return c.toDataURL("image/jpeg",.82);
}

const ivl=m=>24/m.perDay*HR;
function computeNextAt(time,perDay){
  const [h,mi]=time.split(":").map(Number);const d=new Date();d.setHours(h,mi,0,0);
  let t=d.getTime();const iv=24/perDay*HR;while(t<Date.now()-60000)t+=iv;return t;
}
function timesOfDay(perDay,time){
  const [h,mi]=time.split(":").map(Number);const base=h*60+mi;const iv=24/perDay*60;
  return Array.from({length:perDay},(_,k)=>Math.round((base+k*iv)%1440)).sort((a,b)=>a-b)
    .map(x=>{const d=new Date();d.setHours(Math.floor(x/60),x%60,0,0);return fmtTime(d)});
}

function upcoming(){

  for(const m of S.user.meds){for(let t=m.nextAt,k=0;t<end&&k<24;t+=ivl(m),k++)out.push({m,t})}

async function doseAction(medId,status,quiet){

  undoSnap={medId,nextAt:m.nextAt,qty:m.qty,logLen:S.user.log.length};
  S.user.log.push({medId,name:m.name,at:m.nextAt,status,ts:Date.now()});
  if(status==="taken"&&m.countable)m.qty=Math.max(0,(m.qty||0)-(m.dosePer||1));
  m.nextAt+=ivl(m);
  while(m.nextAt<Date.now()-ivl(m)*.5){S.user.log.push({medId,name:m.name,at:m.nextAt,status:"missed",ts:Date.now()});m.nextAt+=ivl(m)}

function searchLabs(q){
  q=arN(q);if(!q)return[];const T=q.split(" "),out=[];
  LABS.forEach((l,i)=>{if(T.every(t=>l.idx.includes(t)))out.push([l.idx.indexOf(T[0]),i])});

}

  do{if(t.repeat==="daily")d.setDate(d.getDate()+1);else if(t.repeat==="weekly")d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1)}while(d.getTime()<Date.now()-60000);
  t.at=d.getTime();
}
function resTxt(t,r){
  if(t.kind==="bp")return `${r.v}/${r.v2} mmHg${r.p?` • نبض ${r.p}`:""}`;
  if(t.kind==="val")return `${r.v}${t.unit?" "+t.unit:""}`;
  return r.note||"تم";
}

async function saveTest(){
  const e=TE;if(!e.item){toast("اختر القياس أو التحليل أولًا");return}
  let at=new Date(e.date+"T"+e.time).getTime();if(!isFinite(at)){toast("اختر اليوم والوقت");return}
  if(at<Date.now()-60000&&e.repeat==="none"){toast("اختر موعدًا في المستقبل");return}
  const list=S.user.tests;let t=list.find(x=>x.id===e.id);
  if(!t){t=Object.assign({id:e.id,results:[]},e.item);delete t.idx;list.push(t)}
  t.at=at;t.repeat=e.repeat;t.done=false;
  if(e.repeat!=="none"&&at<Date.now()-60000)advanceTest(t);
  delete alerted[t.id];await persist();closeSheet();render();toast("تم حفظ الموعد");
}

async function requestEmailOtp(email,returnView,meta={}){
  S.login.email=email;S.err="";

  if(!/^https?:$/.test(location.protocol)){S.err="افتح التطبيق من localhost أو رابط HTTPS لإرسال رمز الدخول.";S.view=returnView;render();return}
  S.busy=true;S.view=returnView;render();
  try{await Cloud.sendOtp(email,meta);S.busy=false;S.verify={email,type:"email"};S.view="verify";render();toast("أُرسل رمز الدخول إلى بريدك الإلكتروني")}
  catch(e){S.busy=false;S.err=cloudMsg(e);S.view=returnView;render()}
}

const norm=s=>s.replace(/[\u064B-\u0652\u0670]/g,""),AR=/[\u0600-\u06FF]/;
const M=D.map(([a,e])=>[norm(a),e]).sort((x,y)=>y[0].length-x[0].length),EX=new Map(M);
function trText(s){
  if(!AR.test(s))return s;const n=norm(s),k=n.trim();
  if(EX.has(k))return n.replace(k,EX.get(k));
  let o=n,c=false;for(const[a,e]of M){if(a.length<5||!o.includes(a))continue;o=o.split(a).join(e);c=true}
  return c?o:s;
}
function trTree(r){
  if(window.ELANG!=="en")return;
  const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){if(/^(SCRIPT|STYLE)$/.test(n.parentNode?.nodeName))continue;const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  if(r.querySelectorAll)r.querySelectorAll("[aria-label],[placeholder],[title]").forEach(el=>{for(const a of["aria-label","placeholder","title"]){const v=el.getAttribute(a);if(v&&AR.test(v)){const t=trText(v);if(t!==v)el.setAttribute(a,t)}}});
}

  const top=[...brands.entries()].filter(r=>r[1]>=.12).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(!top.length)return null;
  const {oa,on,onu}=ocrSets(words,text),best=top[0][1],noNums=on.size===0,out=[];
  for(const[bw,bs]of top)for(const i of fm.get(bw)||[]){
    const c=nameToks(NU[i]);let s=4*(bs/best);
    for(const t of c.al){
      if(t===bw)continue;
      if(t.length===1){s+=oa.has(t)?.5:-.5;continue}
      s+=oa.has(t)?2.5:fuzzyHas(oa,t)?1.5:-3;
    }
    for(const n of c.st){const k=normNum(n);s+=onu.has(k)?2.5:on.has(k)?1:(noNums?-.3:-2.5)}
    for(const n of c.wk)if(on.has(normNum(n)))s+=.3;
    s-=NU[i].length*.01;
    out.push([s,i]);
  }
  if(!out.length)return null;
  out.sort((a,b)=>b[0]-a[0]);
  const sm=String(text||"").match(/(\d+(?:[.,]\d+)?)\s*(mg|mcg|µg|ug|g|ml|iu)\b/i);
  return{idx:out[0][1],alts:out.slice(1,6).map(x=>x[1]),name:top[0][0],strength:sm?sm[1].replace(",",".")+" "+sm[2].toLowerCase():"",score:out[0][0],bscore:best,low:!(best>=.7||out[0][0]>=4)};
}

/* ---- image preparation ---- */
async function bitmapOf(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
}
function canvasOf(bmp,invert){
  const w0=bmp.width,h0=bmp.height,k=1600/Math.max(w0,h0);
  const c=document.createElement("canvas");c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data,hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const g=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0;d[i]=g;hist[g]++}
  const n=c.width*c.height;let a=0,lo=0,hi=255;
  for(let v=0;v<256;v++){a+=hist[v];if(a>=n*.02){lo=v;break}}
  a=0;for(let v=255;v>=0;v--){a+=hist[v];if(a>=n*.02){hi=v;break}}
  const sc=255/Math.max(40,hi-lo);
  for(let i=0;i<d.length;i+=4){let g=Math.max(0,Math.min(255,(d[i]-lo)*sc));if(invert)g=255-g;d[i]=d[i+1]=d[i+2]=g;d[i+3]=255}
  x.putImageData(im,0,0);return c;
}

/* ---- Tesseract worker (lazy; the script + language data are fetched once and then cached) ---- */
let tp=null,wp=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return tp||(tp=new Promise((res,rej)=>{const s=document.createElement("script");s.src=TJS;s.onload=res;s.onerror=()=>{tp=null;rej(new Error("offline"))};document.head.appendChild(s)}));
}
function getWorker(){
  return wp||(wp=(async()=>{
    await loadTess();
    let w;
    try{w=await Tesseract.createWorker("eng",1,{langPath:LANGP})}
    catch{w=await Tesseract.createWorker("eng",1,{})}
    await w.setParameters({tessedit_pageseg_mode:"11",preserve_interword_spaces:"1"});
    return w;
  })().catch(e=>{wp=null;throw e}));
}
function wordsOf(data){
  let ws=data.words;
  if(!ws||!ws.length){ws=[];for(const b of data.blocks||[])for(const p of b.paragraphs||[])for(const l of p.lines||[])for(const w of l.words||[])ws.push(w)}
  return ws.map(w=>({text:w.text,conf:w.confidence,h:w.bbox?w.bbox.y1-w.bbox.y0:0}));
}
async function ocrOnce(w,canvas){
  const {data}=await Promise.race([w.recognize(canvas),new Promise((_,no)=>setTimeout(()=>no(new Error("timeout")),70000))]);
  return{words:wordsOf(data),text:data.text||""};
}
async function localRecognize(file){
  const w=await getWorker(),bmp=await bitmapOf(file);let words=[],text="",best=null;
  for(const inv of [false,true]){
    const r=await ocrOnce(w,canvasOf(bmp,inv));words=words.concat(r.words);text+="\n"+r.text;
    const f=matchFull(words,text);if(f&&(!best||f.score>best.score))best=f;
    if(best&&!best.low&&best.score>=7)break; // confident enough: skip the second (inverted) pass
  }
  if(best)return best;
  return matchWords(words,text);
}
window.__ocr={matchWords,matchFull,localRecognize,cleanWord,nameToks};

/* ---- replace the photo handler: Claude-viewer AI if present, otherwise on-device OCR ---- */
applyPhoto=async function(file){
  try{
    const {thumb,big}=await prepPhoto(file);if(!E)return;
    E.photo=thumb;E.recog="busy";renderEditor();
    const my=E.id;let r=null,offline=false;
    if(SAMPLE&&SCAPS&&SCAPS.images){try{r=await recognize(big)}catch{r=null}}
    if(!r||!r.name){try{r=await localRecognize(file)}catch(e){r=null;offline=String(e&&e.message)==="offline"}}
    if(!E||E.id!==my)return;
    let hits=[];
    if(r&&r.idx!=null){hits=[r.idx].concat((r.alts||[]).filter(x=>x!==r.idx))}
    else if(r){for(const q of [((r.name||"")+" "+(r.strength||"")).trim(),r.name,r.generic]){if(q&&q.trim()){hits=searchDrugs(q);if(hits.length)break}}}
    if(r&&r.low&&hits.length){E.matches=hits;E.q=r.name||"";E.recog="miss"}
    else if(hits.length){E.matches=hits;pickDrug(hits[0]);E.q=(r&&r.idx!=null)?NU[hits[0]]:(r.name||"");E.recog="found"}
    else{E.recog="miss";if(r&&r.name){E.q=r.name;E.matches=searchDrugs(r.name)}}

    if(offline)toast("قراءة الصورة تحتاج إنترنت أول مرة. اكتب اسم الدواء أو أعد المحاولة عند الاتصال.");
  }catch{toast("تعذّر قراءة الصورة، جرّب صورة أخرى")}
};
})();

<script>
/* ===== Arabic names + barcode: direct Arabic search, barcode scan, Arabic OCR fallback ===== */
(()=>{
const nAr=s=>String(s||"").replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
  .toLowerCase().replace(/[^ء-يa-z0-9 .\/]/g," ").replace(/(\d)([ء-يa-z])/g,"$1 $2").replace(/([ء-ي])(\d)/g,"$1 $2").replace(/\//g," ").replace(/\s+/g," ").trim();
let ARN=null,BC=null;
const prep=()=>{if(ARN)return;ARN=D.map(r=>nAr(r[6]));BC=new Map();D.forEach((r,i)=>{const b=r[7];if(b&&!BC.has(b))BC.set(b,i)})};
const hasAr=s=>/[؀-ۿ]/.test(s||"");
const STOPF=new Set("قرص اقراص كبسوله كبسولات شراب حقن امبول امبولات كريم جل مرهم قطره فوار معلق محلول شريط اقراص مجم جم مل ملجم لبوس تحاميل بخاخ".split(" "));
function arBrand(ar){
  const out=[];for(const w of String(ar||"").trim().split(/\s+/)){const n=nAr(w);if(!n||/\d/.test(n)||STOPF.has(n))break;out.push(w);if(out.length>=3)break}
  return out.join(" ");
}
/* ---- search ---- */
const sd2=searchDrugs;
searchDrugs=function(q,limit=8){
  if(!window.__dbReady)return[];
  prep();q=String(q||"").trim();
  if(/^\d{8,14}$/.test(q)){const i=BC.get(q);return i===undefined?[]:[i]}
  if(!hasAr(q))return sd2(q,limit);
  const T=nAr(q).split(" ").filter(Boolean),res=[];
  if(T.length){
    for(let i=0;i<ARN.length;i++){const n=ARN[i];if(!n)continue;const h=" "+n;let s=0;
      for(const t of T){let p=h.indexOf(" "+t);if(p>=0)s+=p===0?6:3;else if(t.length>=3&&h.indexOf(t)>=0)s+=1;else{s=0;break}}
      if(s)res.push([s,i])}
    res.sort((a,b)=>b[0]-a[0]||ARN[a[1]].length-ARN[b[1]].length);
  }
  const r=res.slice(0,limit).map(x=>x[1]);
  if(r.length<limit){const seen=new Set(r);for(const i of sd2(q,limit)){if(r.length>=limit)break;if(!seen.has(i))r.push(i)}}
  return r;
};
/* ---- barcode ---- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("offline"));document.head.appendChild(s)})}
async function bmpOf(file){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}
async function readBarcode(file){
  const bmp=await bmpOf(file);
  if("BarcodeDetector"in window){
    try{const d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});const r=await d.detect(bmp);for(const x of r)if(x.rawValue)return x.rawValue}catch{}
  }
  try{
    if(!window.ZXing)await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const c=document.createElement("canvas"),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const h=new Map([[ZXing.DecodeHintType.TRY_HARDER,true],[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.CODE_128]]]);
    const rd=new ZXing.MultiFormatReader();rd.setHints(h);
    const lum=new ZXing.HTMLCanvasElementLuminanceSource(c);
    return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum))).getText();
  }catch{}
  return null;
}
/* ---- Arabic OCR matching ---- */
let FT=null;
function firstTok(){
  if(FT)return FT;prep();const m=new Map(),by={};
  ARN.forEach((n,i)=>{if(!n)return;const t=n.split(" ")[0];if(t.length<3||/\d/.test(t))return;(m.get(t)||m.set(t,[]).get(t)).push(i)});
  for(const t of m.keys())(by[t.length]=by[t.length]||[]).push(t);
  return FT={m,by};
}
function lev(a,b,k){const n=a.length,m=b.length;if(Math.abs(n-m)>k)return k+1;let p=Array.from({length:m+1},(_,j)=>j);
  for(let i=1;i<=n;i++){const c=[i];let lo=i;for(let j=1;j<=m;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c[j]=v;if(v<lo)lo=v}if(lo>k)return k+1;p=c}return p[m]}
function matchArabic(words,text){
  const {m,by}=firstTok(),toks=[...new Set((words.map(w=>nAr(w.text||w)).join(" ")+" "+nAr(text||"")).split(" ").filter(Boolean))];
  const alpha=new Set(toks.filter(t=>/[ء-ي]/.test(t))),nums=new Set(toks.filter(t=>/^\d+(\.\d+)?$/.test(t)));
  const cand=new Map();
  for(const w of alpha){if(w.length<3)continue;
    let hit=m.has(w)?[[w,1]]:[];
    if(!hit.length&&w.length>=5)for(let l=w.length-1;l<=w.length+1;l++)for(const t of by[l]||[])if(lev(w,t,1)<=1)hit.push([t,.6]);
    for(const [t,q] of hit)for(const i of m.get(t))cand.set(i,Math.max(cand.get(i)||0,q*(Math.min(w.length,7)/7)))}
  const rank=[];
  for(const [i,b] of cand){let s=4*b;const ts=ARN[i].split(" ");
    for(let j=1;j<ts.length;j++){const t=ts[j];if(/[ء-ي]/.test(t)){if(alpha.has(t)&&!STOPF.has(t))s+=1.2}else if(/^\d+(\.\d+)?$/.test(t)&&t.length>=2){s+=nums.has(t)?1.5:(nums.size?-1.5:-.2)}}
    rank.push([s,i])}
  rank.sort((a,b)=>b[0]-a[0]||ARN[a[1]].length-ARN[b[1]].length);
  if(!rank.length)return null;
  return{idx:rank[0][1],alts:rank.slice(0,5).map(x=>x[1]),score:rank[0][0],low:rank[0][0]<3.2};
}
let aw=null;
async function araWorker(){
  return aw||(aw=(async()=>{
    if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    let w;try{w=await Tesseract.createWorker("ara",1,{langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/ara@1.0.0/4.0.0_best_int"})}catch{w=await Tesseract.createWorker("ara",1,{})}
    await w.setParameters({tessedit_pageseg_mode:"11"});return w;
  })().catch(e=>{aw=null;throw e}));
}
async function arabicOcr(file){
  const w=await araWorker(),bmp=await bmpOf(file),k=Math.min(1.5,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const {data}=await Promise.race([w.recognize(c),new Promise((_,no)=>setTimeout(()=>no(new Error("timeout")),70000))]);
  let ws=data.words||[];if(!ws.length)for(const b of data.blocks||[])for(const p of b.paragraphs||[])for(const l of p.lines||[])ws.push(...(l.words||[]));
  return matchArabic(ws.map(x=>({text:x.text})),data.text||"");
}
/* ---- photo flow: barcode first, then the existing English OCR, then Arabic OCR ---- */
const ap=applyPhoto;
applyPhoto=async function(file){
  try{await loadDB()}catch{}
  let bc=null;
  try{bc=await Promise.race([readBarcode(file),new Promise(r=>setTimeout(()=>r(null),6000))])}catch{}
  prep();const bi=bc?BC.get(String(bc)):undefined;
  if(bi!==undefined&&E){
    try{const {thumb}=await prepPhoto(file);if(!E)return;E.photo=thumb;E.matches=[bi];pickDrug(bi);E.q=D[bi][0];E.recog="found";renderEditor();toast("تم التعرّف على الدواء من الباركود");return}catch{}
  }
  const my=E&&E.id;
  await ap(file);
  if(!E||E.id!==my||E.sel!==null||E.recog!=="miss")return;
  try{
    E.recog="busy";renderEditor();
    const r=await arabicOcr(file);if(!E||E.id!==my)return;
    if(r&&!r.low){E.matches=r.alts;pickDrug(r.idx);E.q=D[r.idx][0];E.recog="found"}
    else{E.recog="miss";if(r)E.matches=r.alts}
    renderEditor();
  }catch{if(E&&E.id===my){E.recog="miss";renderEditor()}}
};
window.__ar={nAr,arBrand,matchArabic,readBarcode,prep:()=>{prep();return{ARN,BC}}};
})();
</script>
<script>

(()=>{
const css=document.createElement("style");css.textContent=`
.tcard{background:var(--card,#fff);border-radius:18px;box-shadow:0 1px 2px rgba(60,64,67,.18),0 1px 3px 1px rgba(60,64,67,.1);overflow:hidden}

`;document.head.appendChild(css);
const oldTabTests=tabTests;
tabTests=function(){
  const T=(S.user.tests||[]).slice().sort((a,b)=>(!!a.done-!!b.done)||a.at-b.at);
  return `<div class="sec"><h3>القياسات والتحاليل</h3></div>
  <button class="btn primary" data-a="addTest">${ic("plus",20)} إضافة قياس أو تحليل</button>
  <p class="hint" style="margin:8px 2px 14px">اختر اليوم والوقت، وسنذكّرك بنفس طريقة تذكير الدواء.</p>
  <div class="list">${T.map(t=>{const has=!t.done&&t.at>Date.now()-60000;return `<div class="tcard">${testRow(t,true)}<div class="tq"><button data-a="tOld" data-id="${esc(t.id)}">${ic("plus",18)} إضافة قياس</button><button data-a="tAlert" data-id="${esc(t.id)}">${ic("bell",18)} ${has?"تعديل التنبيه":"إضافة تنبيه"}</button></div></div>`}).join("")}</div>
  ${T.length?"":`<div class="empty"><div class="big">${ic("flask",44)}</div>مثال: قياس ضغط الدم كل صباح، أو تحليل فيتامين د بعد شهر.</div>`}`;
};
/* Android app only: one-tap test of the closed-app alarm + speech */
const oldSettings=tabSettings;
tabSettings=function(){
  const h=oldSettings();
  if(!window.AndroidElagi||!AndroidElagi.testAlarm)return h;
  const card=`<div class="card" style="margin-bottom:14px"><div class="sw"><div>اختبار التنبيه<small>اضغط ثم أغلق التطبيق تمامًا. بعد 20 ثانية يجب أن يرنّ الجرس وينطق الاسم.</small></div><button class="btn ghost" style="width:auto;min-height:40px" data-a="nTest">اختبار</button></div></div>`;
  const mark='<div style="display:grid;gap:10px"><button class="btn ghost" data-a="logout">';
  return h.includes(mark)?h.replace(mark,card+mark):h+card;
};
Object.assign(ACT,{nTest(){try{const u=S.user,txt=window.__alarmText?__alarmText("med",{id:"x",name:(u.meds&&u.meds[0]&&u.meds[0].name)||"بانادول"}):"اختبار التنبيه";AndroidElagi.testAlarm(txt);toast("أغلق التطبيق الآن، سيرنّ بعد 20 ثانية")}catch{toast("غير متاح")}}});
/* speech needs a user gesture on some phones: speak on the first touch if the page was opened from a notification */
let hint=null;
function armTap(){
  if(hint)return;
  hint=document.createElement("div");hint.className="tap-hint";hint.textContent="🔊 المس الشاشة لسماع التنبيه";document.body.appendChild(hint);
  const go=()=>{removeEventListener("pointerdown",go,true);try{hint&&hint.remove()}catch{}hint=null;
    setTimeout(()=>{try{if(A&&!speechSynthesis.speaking)alarmSpeak()}catch{}},120)};
  addEventListener("pointerdown",go,true);
  setTimeout(()=>{try{hint&&hint.remove()}catch{}hint=null},12000);
}
function fromNotif(){
  try{checkDue()}catch{}
  setTimeout(()=>{try{if(A)armTap()}catch{}},900);
}
if("serviceWorker"in navigator)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="speak")fromNotif()});
try{if(/[?&]speak=1/.test(location.search)){history.replaceState(null,"",location.pathname);setTimeout(fromNotif,1200)}}catch{}
})();
</script>
